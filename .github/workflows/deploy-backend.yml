name: Deploy Supabase backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check deployment settings
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Add the SUPABASE_ACCESS_TOKEN repository secret."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Add the SUPABASE_DB_PASSWORD repository secret."; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Add the SUPABASE_PROJECT_ID repository variable."; exit 1; }
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migrations
        run: supabase db push --linked --yes
      - name: Deploy AI chat function
        run: supabase functions deploy ai-chat --project-ref "$SUPABASE_PROJECT_ID"
